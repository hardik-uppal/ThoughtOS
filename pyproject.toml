[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thoughtos-server"
version = "0.1.0"
description = "Personal knowledge graph + note & task manager — with MCP server for Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hardik"},
]
keywords = ["knowledge-graph", "notes", "tasks", "mcp", "claude-code", "thoughtos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gemini = ["google-generativeai>=0.8"]
openai = []  # uses urllib, no extra deps
all = [
    "thoughtos-server[gemini]",
    "google-generativeai>=0.8",
]

[project.scripts]
thoughtos = "thoughtos_server.cli:main"
thoughtos-sync = "thoughtos_server.sync:main"
thoughtos-remote = "thoughtos_server.sync:remote_main"

[tool.setuptools.packages.find]
include = ["thoughtos_server*", "logic*", "backend*"]

[tool.setuptools.package-dir]
"thoughtos_server" = "thoughtos_server"
"logic" = "logic"
"backend" = "backend"
